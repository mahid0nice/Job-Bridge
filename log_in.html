<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobBridge - Log in</title>
  <link rel="stylesheet" href="log.css">
</head>
<body>
 
  <header class="loginpage-header">
    <div class="inner">
      <a class="logo" href="login.html">JobBridge</a>
      <a class="staff-link" href="staff-login.html">Staff portal</a>
    </div>
  </header>
 
  <main class="form-box">
    <h1>Welcome back</h1>
    <p class="small-text">Log in to your JobBridge account.</p>
 
    <form action="#" method="post">
 
      <div class="role-choice">
        <label><input type="radio" name="role" value="seeker" checked> Job seeker</label>
        <label><input type="radio" name="role" value="company"> Company</label>
      </div>
 
      <label class="field" for="email">Email</label>
      <input type="email" id="email" name="email" required>
 
      <label class="field" for="password">Password</label>
      <input type="password" id="password" name="password" required>
 
      <button class="btn" type="submit">Log in</button>
 
      <p class="switch-text">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main>
 
</body>
</html>
