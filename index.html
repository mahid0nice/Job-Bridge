
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobBridge - Jobseeker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Navigation Bar -->
    <header class="navbar">
        <h2>JobBridge</h2>
        <div class="user-info">
            <span>Signed in as <b>Job seeker</b></span>
            <button id="logoutBtn" class="logout-btn">Log out</button>
        </div>
    </header>
    <div class="notice">
        Live demo: Post your CV and apply for suitable jobs.
    </div>
    <main class="container">
        <section class="intro">
            <h1>Find work. Be found.</h1>
            <p>Post your CV once and apply for available jobs.</p>
        </section>
        <div class="dashboard">
            <!-- CV Form -->
            <section class="card cv-card">
                <h3>Post Your CV</h3>
                <form id="cvForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName"
                               placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email"
                               placeholder="example@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone"
                               placeholder="01XXXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age"
                               placeholder="Enter your age"
                               min="16" max="100" required>
                    </div>
                    <div class="form-group">
                        <label for="field">Field / Study</label>
                        <select id="field" required>
                            <option value="">Select your field</option>
                            <option value="BBA">BBA</option>
                            <option value="CSE">CSE</option>
                            <option value="English">English</option>
                            <option value="EEE">EEE</option>
                            <option value="Economics">Economics</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="skills">Select Your Skills</label>
                        <select id="skills" required>
                            <option value="">Select your skill</option>
                            <option value="Communication">Communication</option>
                            <option value="Excel">Excel</option>
                            <option value="Word">Microsoft Word</option>
                            <option value="Graphic Design">Graphic Design</option>
                            <option value="Photoshop">Photoshop</option>
                            <option value="Figma">Figma</option>
                            <option value="Programming">Programming</option>
                            <option value="HTML">HTML</option>
                            <option value="CSS">CSS</option>
                            <option value="JavaScript">JavaScript</option>
                            <option value="Teamwork">Teamwork</option>
                            <option value="English">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cvFile">CV File</label>
                        <input type="file" id="cvFile"
                               accept=".pdf,.doc,.docx" required>
                        <small>PDF, DOC or DOCX (Maximum 5 MB)</small>
                    </div>
                    <div class="form-group">
                        <label for="comment">Additional Comment</label>
                        <textarea id="comment"
                                  rows="4"
                                  placeholder="Write something about yourself..."></textarea>
                    </div>
                    <button type="submit" class="primary-btn">
                        Publish My CV
                    </button>
                    <p id="cvMessage" class="message"></p>
                </form>
                <div id="cvProfile" class="profile-box"></div>
            </section>
            <!-- Open Jobs -->
            <section class="card jobs-card">
                <h3>Open Jobs</h3>
                <input type="text" id="searchInput"
                       placeholder="Search by job, company or skill">
                <div class="filter-group">
                    <label for="jobFilter">Show Jobs:</label>
                    <select id="jobFilter">
                        <option value="all">All Jobs</option>
                        <option value="eligible">Eligible Jobs Only</option>
                    </select>
                </div>
                <p id="jobCount" class="job-count"></p>
                <div id="jobList"></div>
            </section>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
