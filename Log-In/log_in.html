<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobBridge - Log in</title>
  <link rel="stylesheet" href="log.css">
</head>
<body>

  <header class="loginpage-header">
    <div class="inner">
      <a class="logo" href="log_in.html">JobBridge</a>
    </div>
  </header>

  <main class="form-box">
    <h1>Welcome back</h1>
    <p class="small-text">Log in to your JobBridge account.</p>

    <form action="#" method="post">

      <div class="role-choice">
        <label class="role-btn"><input type="radio" name="role" value="admin" checked><span>Admin</span></label>
        <label class="role-btn"><input type="radio" name="role" value="employee"><span>Employee</span></label>
      </div>

      <label class="field" for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label class="field" for="password">Password</label>
      <input type="password" id="password" name="password" required>

      <button class="btn" type="submit">Log in</button>

      <p class="switch-text">New here? <a href="signup.html">Create an account</a></p>
    </form>
  </main>

</body>
</html>
